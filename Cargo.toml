[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ductkit/engine"

[workspace.dependencies]
ductkit-core = { path = "crates/core" }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
form_urlencoded = "1.2.3"
futures-core = "0.3.34"
futures-util = "0.3.34"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
toml = "1.2.3"
